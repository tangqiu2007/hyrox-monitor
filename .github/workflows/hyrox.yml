name: HYROX Ticket Daily Report & Monitor

on:
  schedule:
    # 每 10 分钟自动运行（已自动涵盖北京时间 09:00 早报与 18:00 晚报时段，避免重复触发导致的并发取消）
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check-ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: hyrox-check
      cancel-in-progress: true

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4

      - name: 执行查票脚本
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASS: ${{ secrets.SENDER_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python hyrox_check.py
