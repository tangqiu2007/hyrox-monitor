name: HYROX Ticket Daily Report & Monitor
on:
  schedule:
    # 北京时间 09:00 → UTC 01:00 早报
    - cron: '0 1 * * *'
    # 北京时间 18:00 → UTC 10:00 晚报
    - cron: '0 10 * * *'
    # 每10分钟监控余票
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check-ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: hyrox-check
      cancel-in-progress: true

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置系统时区 Asia/Shanghai
        run: sudo timedatectl set-timezone Asia/Shanghai

      - name: 配置Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4

      - name: 执行查票脚本
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASS: ${{ secrets.SENDER_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python hyrox_check.py
